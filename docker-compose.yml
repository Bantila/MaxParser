services:
  max-backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
    # Мост не слушает ни одного порта, поэтому в сети хоста он ничего не
    # занимает и ни с чем не конфликтует. Нужен, чтобы дотянуться до
    # SSH-туннеля на 127.0.0.1:21080 (см. deploy/maxparser-tunnel.service).
    network_mode: host
    # Чтобы мост не отъел память у соседей по серверу.
    mem_limit: 256m
